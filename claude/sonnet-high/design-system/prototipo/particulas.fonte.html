<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Umbra · Partículas e bloom</title>
<!-- Gerado por scripts/build_prototipo.py a partir de design-system/prototipo/particulas.fonte.html. Editar a fonte. -->
<style>
{{TOKENS_CSS}}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--obs-background);color:var(--obs-text-primary);font-family:var(--obs-font);font-size:16px;line-height:24px;-webkit-user-select:none;user-select:none}
#cena{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
[hidden]{display:none!important}
.barra{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:var(--obs-space-sm);align-items:center;justify-content:space-between;padding:max(var(--obs-space-md),env(safe-area-inset-top,0px)) max(var(--obs-space-lg),env(safe-area-inset-right,0px)) var(--obs-space-sm) max(var(--obs-space-lg),env(safe-area-inset-left,0px));pointer-events:none}
.barra > *{pointer-events:auto}
.marca{font-size:14px;letter-spacing:4px;color:var(--obs-text-secondary)}
.marca small{letter-spacing:.2px;color:var(--obs-text-muted);margin-left:var(--obs-space-sm)}
.controles{display:flex;flex-wrap:wrap;gap:var(--obs-space-sm);align-items:center}
select,.botao{font:inherit;font-size:14px;min-height:44px;background:var(--obs-surface);color:var(--obs-text-primary);border:var(--obs-border-width) solid var(--obs-border-control);border-radius:0;padding:0 var(--obs-space-md);cursor:pointer}
.botao[aria-pressed="true"]{border-color:var(--obs-accent);background:var(--obs-surface-pressed)}
select:focus-visible,.botao:focus-visible{outline:var(--obs-focus-width) solid var(--obs-accent);outline-offset:var(--obs-focus-offset)}
#instrucao{position:fixed;left:50%;bottom:max(var(--obs-space-xl),env(safe-area-inset-bottom,0px));transform:translateX(-50%);margin:0;padding:var(--obs-space-sm) var(--obs-space-lg);background:color-mix(in srgb,var(--obs-background) 72%,transparent);color:var(--obs-text-secondary);transition:opacity 600ms var(--obs-ease);text-align:center;width:max-content;max-width:calc(100% - 32px)}
#info{position:fixed;left:max(var(--obs-space-lg),env(safe-area-inset-left,0px));bottom:max(var(--obs-space-lg),env(safe-area-inset-bottom,0px));font-size:12px;line-height:18px;color:var(--obs-text-muted);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--obs-background) 72%,transparent);padding:var(--obs-space-xs) var(--obs-space-sm)}
.aviso{position:fixed;inset:0;display:grid;place-items:center;background:var(--obs-background);padding:var(--obs-space-lg)}
.aviso div{max-width:400px;background:var(--obs-surface);border:1px solid var(--obs-border-decorative);padding:var(--obs-space-xl)}
@media (prefers-reduced-motion:reduce){#instrucao{transition:none}}
</style>
</head>
<body>
<canvas id="cena" aria-label="Universo do Umbra. Deslize para explorar."></canvas>
<div class="barra">
  <span class="marca">UMBRA<small>Protótipo 2 · partículas na GPU e bloom</small></span>
  <div class="controles" role="group" aria-label="Controles do protótipo">
    <label class="marca" for="paleta" style="letter-spacing:.2px">Paleta</label>
    <select id="paleta"><option value="0">Obsidiana</option><option value="1">Neon (referência)</option></select>
    <label class="marca" for="qualidade" style="letter-spacing:.2px">Qualidade</label>
    <select id="qualidade"><option value="0">Econômica</option><option value="1" selected>Equilíbrio</option><option value="2">Alta</option></select>
    <button type="button" class="botao" id="som" aria-pressed="false">Ativar som</button>
    <button type="button" class="botao" id="crescer">Crescer ×2</button>
    <button type="button" class="botao" id="pausa" aria-pressed="false">Pausar</button>
  </div>
</div>
<p id="instrucao"></p>
<div id="info" aria-live="off"></div>
<script type="application/json" id="tokens">{{TOKENS_JSON}}</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">{{ICONES}}</svg>
<script>
{{PROTOTIPO_JS}}
</script>
</body>
</html>
